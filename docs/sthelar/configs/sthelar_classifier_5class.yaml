# STHELAR 5-class Classifier Training Configuration
#
# This config trains a CellViT++ cell classifier head on the STHELAR dataset
# using the 5-class label space: Immune, Stromal, Epithelial, Other
#
# Prerequisites:
#   1. Download and preprocess the dataset:
#      python -m cellvit.training.datasets.sthelar.prepare_sthelar \
#          --output_dir /path/to/STHELAR_processed \
#          --magnification 40x \
#          --num_classes 5 \
#          --split_strategy spatial
#
#   2. Download a pretrained CellViT checkpoint (e.g., CellViT-256-x40-AMP.pth)
#
# Training command:
#   python cellvit/train_cell_classifier_head.py \
#       --config docs/sthelar/configs/sthelar_classifier_5class.yaml

logging:
  mode: offline
  project: cellvit++
  notes: STHELAR 5-class classifier
  log_comment: STHELAR-5class
  tags:
    - Classifier
    - STHELAR
    - 5-class
  wandb_dir: ./logs_local/wandb
  log_dir: ./logs_local
  level: Info

random_seed: 42
gpu: 0

data:
  dataset: STHELAR
  dataset_path: /path/to/STHELAR_processed   # ← UPDATE THIS PATH
  normalize_stains_train: false
  normalize_stains_val: false
  num_classes: 4   # 4 cell types (Immune, Stromal, Epithelial, Other) excluding background
  label_map:
    0: Immune
    1: Stromal
    2: Epithelial
    3: Other

# Path to pretrained CellViT model checkpoint
cellvit_path: ./checkpoints/CellViT-256-x40-AMP.pth   # ← UPDATE THIS PATH

model:
  hidden_dim: 128

training:
  batch_size: 256
  epochs: 50
  drop_rate: 0.1
  optimizer: AdamW
  optimizer_hyperparameter:
    lr: 0.001
    betas:
      - 0.85
      - 0.9
    weight_decay: 0.0008
  early_stopping_patience: 15
  scheduler:
    scheduler_type: constant
  mixed_precision: true
  eval_every: 1
  cache_cell_dataset: true

transformations:
  randomrotate90:
    p: 0.5
  horizontalflip:
    p: 0.5
  verticalflip:
    p: 0.5
  downscale:
    p: 0.15
    scale: 0.5
  blur:
    p: 0.2
    blur_limit: 10
  gaussnoise:
    p: 0.25
    var_limit: 50
  colorjitter:
    p: 0.2
    scale_setting: 0.25
    scale_color: 0.1
  superpixels:
    p: 0.1
  zoomblur:
    p: 0.1
  randomsizedcrop:
    p: 0.1
