# Example Configuration for Training CellViT++ with Virchow Foundation Model
#
# This configuration demonstrates how to train CellViT++ using the Virchow foundation model.
# Virchow is a large-scale foundation model from Paige.AI trained on pathology images.
#
# Prerequisites:
# 1. Download Virchow checkpoint from: https://huggingface.co/paige-ai/Virchow
# 2. Place it at: ./checkpoints/virchow_model.pth (or update path below)
# 3. Prepare your dataset
#
# Usage:
#   python3 ./cellvit/train_cellvit.py --config ./configs/foundation_models/train_virchow_pannuke.yaml

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  mode: online
  project: CellViT-Foundation-Comparison
  notes: Training CellViT with Virchow foundation model
  log_comment: CellViT-Virchow-Fold-1
  tags:
    - Virchow
    - Foundation-Model
    - Fold-1
  wandb_dir: ./logs
  log_dir: ./logs
  level: Debug
  group: CellViT-Virchow

# ============================================================================
# Reproducibility
# ============================================================================
random_seed: 19

# ============================================================================
# Hardware Configuration
# ============================================================================
gpu: 0

# ============================================================================
# Dataset Configuration
# ============================================================================
data:
  dataset: PanNuke
  dataset_path: /path/to/pannuke/dataset  # UPDATE THIS PATH
  
  train_folds: [0]
  val_folds: [1]
  test_folds: [2]
  
  num_nuclei_classes: 6
  num_tissue_classes: 19

# ============================================================================
# Model Configuration
# ============================================================================
model:
  # Foundation Model: Virchow
  backbone: virchow
  
  # Path to Virchow checkpoint
  pretrained_encoder: ./checkpoints/virchow_model.pth  # UPDATE THIS PATH
  
  shared_skip_connections: true
  
  # Virchow-specific parameters (automatically set by CellViTVirchow class):
  # - embed_dim: 1280
  # - depth: 32
  # - num_heads: 16
  # - extract_layers: [8, 16, 24, 32]
  # - patch_size: 14
  # - img_size: 224

# ============================================================================
# Loss Function Configuration
# ============================================================================
loss:
  nuclei_binary_map:
    focaltverskyloss:
      loss_fn: FocalTverskyLoss
      weight: 1
    dice:
      loss_fn: dice_loss
      weight: 1
  
  hv_map:
    mse:
      loss_fn: mse_loss_maps
      weight: 2.5
    msge:
      loss_fn: msge_loss_maps
      weight: 8
  
  nuclei_type_map:
    bce:
      loss_fn: xentropy_loss
      weight: 0.5
    dice:
      loss_fn: dice_loss
      weight: 0.2
    mcfocaltverskyloss:
      loss_fn: MCFocalTverskyLoss
      weight: 0.5
      args:
        num_classes: 6
  
  tissue_types:
    ce:
      loss_fn: CrossEntropyLoss
      weight: 0.1

# ============================================================================
# Training Configuration
# ============================================================================
training:
  drop_rate: 0
  attn_drop_rate: 0.1
  drop_path_rate: 0.1
  
  # Virchow is a large model - reduce batch size if needed
  batch_size: 6   # Virchow uses ~5GB VRAM per image
                  # Recommended: 6 for 24GB GPU, 3-4 for 16GB GPU, 12 for 48GB GPU
  
  epochs: 130
  
  optimizer: AdamW
  optimizer_hyperparameter:
    betas: [0.85, 0.95]
    lr: 0.0003
    weight_decay: 0.0001
  
  scheduler:
    scheduler_type: exponential
    hyperparameters:
      gamma: 0.85
  
  early_stopping_patience: 130
  
  unfreeze_epoch: 25
  
  sampling_gamma: 0.85
  sampling_strategy: cell+tissue
  
  mixed_precision: true
  
  eval_every: 1

# ============================================================================
# Notes
# ============================================================================
# 
# Virchow Specifications:
# - Architecture: ViT-H/14 (Vision Transformer Huge with patch size 14)
# - Embedding dimension: 1280
# - Depth: 32 transformer blocks
# - Attention heads: 16
# - Training data: 1.5M pathology images
# - Advantages: State-of-the-art performance on pathology tasks
#
# Memory Usage:
# - Virchow requires approximately 5GB VRAM per image
# - Total VRAM = batch_size * 5GB + overhead (~2GB)
# - For 24GB GPU: batch_size = 4-6
# - For 48GB GPU: batch_size = 8-12
#
# Special Considerations:
# - Virchow has input rescaling for specific image sizes
# - Supports 256x256 and 1024x1024 input sizes
# - Image size is automatically adjusted by the model
